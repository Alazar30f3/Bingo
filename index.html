    <script>
      // Global safeguard against polyfills or libraries trying to set window.fetch in environments with getter-only fetch
      (function() {
        try {
          const _nativeFetch = window.fetch ? window.fetch.bind(window) : null;
          let _currentFetch = _nativeFetch;
          Object.defineProperty(window, 'fetch', {
            get() {
              return _currentFetch || _nativeFetch;
            },
            set(newFetch) {
              _currentFetch = typeof newFetch === 'function' ? newFetch : _nativeFetch;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // Ignore if cannot be overridden
        }
      })();
    </script>
